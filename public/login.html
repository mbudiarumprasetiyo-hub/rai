<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020807">
<title>RAI — Account Access</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#020807;color:#d8fff4;font-family:"Courier New",monospace}
body{min-height:100vh;display:grid;place-items:center;padding:20px}
.container{width:min(430px,100%);padding:30px 25px;border:1px solid rgba(0,255,180,.28);border-radius:18px;background:rgba(2,18,17,.96);box-shadow:0 0 40px rgba(0,255,180,.08),inset 0 0 30px rgba(0,255,180,.025)}
.logo{font-size:42px;font-weight:900;letter-spacing:8px;color:#00ffb4;text-shadow:0 0 20px rgba(0,255,180,.45);text-align:center}
.subtitle{text-align:center;margin-top:8px;font-size:10px;letter-spacing:3px;opacity:.6}
.line{height:1px;margin:25px 0;background:linear-gradient(90deg,transparent,rgba(0,255,180,.45),transparent)}
.status{text-align:center;color:#00ffb4;font-size:11px;letter-spacing:2px;margin-bottom:20px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:20px}
button,input{font-family:inherit}
.tabs button,.submit{min-height:45px;border-radius:9px;cursor:pointer;letter-spacing:1px}
.tabs button{border:1px solid rgba(0,255,180,.2);background:#071411;color:#8bbcaf}
.tabs button.active{border-color:#00ffb4;color:#00ffb4;background:rgba(0,255,180,.09)}
.field{text-align:left;margin:14px 0}
.field label{display:block;font-size:10px;letter-spacing:1px;color:#7da99b;margin-bottom:8px}
.field input{width:100%;height:48px;padding:0 13px;border:1px solid rgba(0,255,180,.2);border-radius:8px;background:#04100e;color:#d8fff4;outline:none;font-size:13px}
.field input:focus{border-color:#00ffb4;box-shadow:0 0 12px rgba(0,255,180,.1)}
.submit{width:100%;margin-top:12px;border:1px solid #00ffb4;background:rgba(0,255,180,.09);color:#00ffb4;font-size:12px;font-weight:bold}
.submit:disabled{opacity:.5;cursor:wait}
.message{display:none;margin-top:15px;padding:11px;border:1px solid rgba(255,90,90,.35);border-radius:8px;color:#ff9999;font-size:11px;line-height:1.5;overflow-wrap:anywhere}
.message.ok{border-color:rgba(0,255,180,.3);color:#00ffb4}
.info{text-align:center;margin-top:20px;font-size:9px;line-height:1.8;opacity:.48}
.back{display:block;text-align:center;margin-top:20px;color:#00ffb4;text-decoration:none;font-size:10px;letter-spacing:1px}
.footer{text-align:center;margin-top:23px;font-size:8px;letter-spacing:1px;opacity:.3}
</style>
</head>
<body>
<main class="container">
    <div class="logo">RAI</div>
    <div class="subtitle">REPUBLIK OF AI</div>
    <div class="line"></div>

    <div class="status" id="status">ACCOUNT AUTHENTICATION</div>

    <div class="tabs">
        <button type="button" id="loginTab" class="active">LOGIN</button>
        <button type="button" id="registerTab">REGISTER</button>
    </div>

    <form id="authForm">
        <div class="field" id="nameField" hidden>
            <label for="name">NAMA PENGGUNA</label>
            <input id="name" name="name" type="text" minlength="2" maxlength="40" autocomplete="name" placeholder="Nama pengguna">
        </div>

        <div class="field">
            <label for="email">EMAIL</label>
            <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required placeholder="nama@email.com">
        </div>

        <div class="field">
            <label for="password">PASSWORD</label>
            <input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" required placeholder="Minimal 8 karakter">
        </div>

        <button class="submit" id="submitButton" type="submit">LOGIN TO RAI</button>
    </form>

    <div class="message" id="message" role="status"></div>

    <div class="info">
        Akun RAI digunakan untuk mengakses fitur yang memerlukan autentikasi.<br>
        Pendaftaran langsung aktif tanpa verifikasi email.
    </div>

    <a class="back" href="/">← KEMBALI KE RAI</a>
    <div class="footer">RAI NEURAL SYSTEM • SECURE ACCESS</div>
</main>

<script>
(() => {
    const form = document.getElementById("authForm");
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const nameField = document.getElementById("nameField");
    const nameInput = document.getElementById("name");
    const passwordInput = document.getElementById("password");
    const submitButton = document.getElementById("submitButton");
    const status = document.getElementById("status");
    const message = document.getElementById("message");

    let mode = "login";

    function showMessage(text, success = false) {
        message.textContent = text;
        message.className = success ? "message ok" : "message";
        message.style.display = "block";
    }

    function setMode(nextMode) {
        mode = nextMode;
        const registering = mode === "register";

        loginTab.classList.toggle("active", !registering);
        registerTab.classList.toggle("active", registering);
        nameField.hidden = !registering;
        nameInput.required = registering;
        passwordInput.autocomplete = registering ? "new-password" : "current-password";
        submitButton.textContent = registering ? "CREATE RAI ACCOUNT" : "LOGIN TO RAI";
        status.textContent = registering ? "NEW ACCOUNT REGISTRATION" : "ACCOUNT AUTHENTICATION";
        message.style.display = "none";
    }

    loginTab.addEventListener("click", () => setMode("login"));
    registerTab.addEventListener("click", () => setMode("register"));

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.style.display = "none";

        const payload = {
            email: document.getElementById("email").value.trim(),
            password: passwordInput.value
        };

        if (mode === "register") {
            payload.name = nameInput.value.trim();
            if (payload.name.length < 2) {
                showMessage("Nama pengguna minimal 2 karakter.");
                return;
            }
        }

        submitButton.disabled = true;
        submitButton.textContent = "PROCESSING...";

        try {
            const endpoint = mode === "register"
                ? "/api/auth/register"
                : "/api/auth/login";

            const response = await fetch(endpoint, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                credentials: "same-origin",
                body: JSON.stringify(payload)
            });

            const result = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(result.message || result.error || "Autentikasi gagal. Periksa data dan coba lagi.");
            }

            showMessage(
                mode === "register"
                    ? "Registrasi berhasil. Membuka RAI..."
                    : "Login berhasil. Membuka RAI...",
                true
            );

            passwordInput.value = "";
            window.location.replace("/");
        } catch (error) {
            showMessage(error.message || "Tidak dapat menghubungi server RAI.");
        } finally {
            submitButton.disabled = false;
            submitButton.textContent = mode === "register"
                ? "CREATE RAI ACCOUNT"
                : "LOGIN TO RAI";
        }
    });

    fetch("/api/auth/me", {credentials: "same-origin"})
        .then(response => response.ok ? response.json() : null)
        .then(data => {
            if (data && data.loggedIn) {
                window.location.replace("/");
            }
        })
        .catch(() => {});
})();
</script>
</body>
</html>
