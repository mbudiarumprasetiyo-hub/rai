<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAI — Access</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020807;
            color: #d8fff4;
            font-family: "Courier New", monospace;
        }

        body {
            display: grid;
            place-items: center;
        }

        .login-container {
            width: min(430px, calc(100% - 36px));
            padding: 32px;
            border: 1px solid rgba(0, 255, 180, 0.28);
            border-radius: 18px;
            background: rgba(2, 18, 17, 0.92);
            box-shadow:
                0 0 40px rgba(0, 255, 180, 0.08),
                inset 0 0 30px rgba(0, 255, 180, 0.025);
            text-align: center;
        }

        .rai-logo {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 8px;
            color: #00ffb4;
            text-shadow: 0 0 20px rgba(0, 255, 180, 0.45);
        }

        .rai-title {
            margin-top: 8px;
            font-size: 11px;
            letter-spacing: 3px;
            opacity: 0.65;
        }

        .login-line {
            height: 1px;
            margin: 28px 0;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(0, 255, 180, 0.45),
                transparent
            );
        }

        .login-status {
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: #00ffb4;
        }

        button {
            width: 100%;
            min-height: 58px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .enter-button {
            border: 1px solid #00ffb4;
            background: rgba(0, 255, 180, 0.08);
            color: #00ffb4;
            box-shadow: 0 0 18px rgba(0, 255, 180, 0.08);
        }

        .enter-button:hover {
            background: rgba(0, 255, 180, 0.14);
            box-shadow: 0 0 28px rgba(0, 255, 180, 0.18);
            transform: translateY(-1px);
        }

        .google-button {
            margin-top: 12px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.04);
            color: #eafff9;
        }

        .google-button:hover {
            border-color: rgba(0, 255, 180, 0.45);
            background: rgba(255, 255, 255, 0.07);
            transform: translateY(-1px);
        }

        button:active {
            transform: scale(0.98);
        }

        .google-icon {
            display: inline-grid;
            place-items: center;
            width: 24px;
            height: 24px;
            margin-right: 8px;
            border-radius: 6px;
            background: white;
            color: #4285f4;
            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: 700;
            vertical-align: middle;
        }

        .info {
            margin-top: 20px;
            font-size: 9px;
            line-height: 1.7;
            letter-spacing: 1px;
            opacity: 0.45;
        }

        .footer {
            margin-top: 22px;
            font-size: 8px;
            letter-spacing: 1px;
            opacity: 0.3;
        }
    </style>
</head>

<body>

    <main class="login-container">

        <div class="rai-logo">RAI</div>

        <div class="rai-title">
            REPUBLIK OF AI
        </div>

        <div class="login-line"></div>

        <div class="login-status">
            SELECT ACCESS MODE
        </div>

        <button
            class="enter-button"
            type="button"
            onclick="window.location.href='/'"
        >
            MASUK KE RAI ENGGINER
        </button>

        <button
            class="google-button"
            type="button"
            onclick="window.location.href='/auth/google'"
        >
            <span class="google-icon">G</span>
            LOGIN WITH GOOGLE
        </button>

        <div class="info">
            RAI ENGGINER dapat digunakan tanpa akun.<br>
            Login Google membuka seluruh fitur yang membutuhkan akun.
        </div>

        <div class="footer">
            RAI NEURAL SYSTEM • SECURE ACCESS
        </div>

    </main>

</body>
</html>
